<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login two</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>
    <main class="wrapper">
        <aside class="text-information">
            <img src="elementos.login/logo-senac.svg" alt="logo-senac" class="logo-senac">
            <h1 class="titulo">Music Hall</h1>
        </aside>

        <form class="acesso" method="post" name="formulario">
            <div class="input-container">
                <label for="Login" class="texto-login">Login:</label>
                <div class="input-whapper">
                    <input type="text" id="Login-acesso" name="#" placeholder="Email ou CPF">
                </div>
            </div>

            <div class="input-container">
                <label for="Senha" class="Senha">Senha:</label>
                <div class="input-whapper">
                    <input type="password" id="Login-senha" name="#" placeholder="Senha">
                    <img src="elementos.login/eye.svg" alt="icon olho visibilidade" class="icon-olho-visiblidade">
                </div>
            </div>
            <div>
                <button type="submit" class="Button">Entrar</button>
            </div>
        </form>
    </main>
</body>
</html>
