<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        <aside class="text-information">
        <img src="Property 1=Variant3.svg" alt="logo-senac" class="logo-senac">
        <h1 class="titulo">Music Hall</h1>
        <h2 class="subtitulo">Login</h2>
        </aside>

        <figure class="wrapper-imagem-right">
            <img src="samuel-regan-asante-J63ln0EZgtg-unsplash 1.svg" alt="imagem da direita" class="bg-imagem-right">
        </figure>

        <form class="acesso" method="post" name="formulario">
            <div class="input-container">
                <label for="Login">Login:</label>
                <div class="input-whapper">
                <input type="text" id="Login-acesso" name="#" placeholder="Email ou CPF">

                <br>
                <label for="Senha">Senha:</label>
                <div class="input-whapper">
                <input type="password" id="Login-senha" name="#" placeholder="Senha">
                <img src="eye.svg" alt="icon olho visibilidade" class="icon-olho-visiblidade">
                </div>
            </div>
            <div>
                <button type="submit">Entrar</button>
            </div>
        </form>
    </main>
</body>
</html>
